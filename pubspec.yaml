name: flutterlane
description: >
  FlutterLane (飞道布局引擎) - A professional IDE-level layered layout engine
  for Flutter desktop applications. Three-layer swimlane architecture with
  drag-and-drop, resize, multi-layout snapshots, and pluggable registry.
version: 1.0.0
homepage: https://github.com/flutterlane/flutterlane

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
