name: flutterlane
description: >
  FlutterLane — A professional IDE-level layered layout engine for Flutter desktop.
  Three-layer swimlane architecture with drag-and-drop, resize, multi-layout
  snapshots, pluggable registry, workspace isolation, and customizable themes.
version: 1.0.0
homepage: https://github.com/flutterlane/flutterlane
repository: https://github.com/flutterlane/flutterlane
issue_tracker: https://github.com/flutterlane/flutterlane/issues
topics:
  - layout
  - desktop
  - ide
  - editor
  - drag-and-drop
  - workspace
  - layout-engine

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
