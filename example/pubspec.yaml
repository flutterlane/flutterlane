name: flutterlane_example
description: Example app showcasing the FlutterLane layout engine.
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutterlane:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  path_provider_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
